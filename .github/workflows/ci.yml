name: Continuous Integration

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  backend-validation:
    name: Backend Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Imports
        run: |
          cd backend
          python -c "from fastapi.testclient import TestClient; from main import app; print('App imported successfully.')"

      - name: Dynamic Test Discovery & Run
        run: |
          cd backend
          if [ -d "tests" ] && [ -n "$(find tests -name 'test_*.py')" ]; then
            echo "Pytest test files found. Executing tests..."
            python -m pytest --ignore=cache
          else
            echo "No pytest test files found under backend/tests/. Skipping pytest."
          fi

  frontend-validation:
    name: Frontend Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build production app
        run: |
          cd frontend
          npm run build

      - name: Verify standalone build
        run: |
          if [ ! -d "frontend/.next/standalone" ]; then
            echo "Error: Next.js standalone directory is missing!"
            exit 1
          fi
          if [ ! -f "frontend/.next/standalone/server.js" ]; then
            echo "Error: Next.js standalone server.js file is missing!"
            exit 1
          fi
          echo "Standalone build verified successfully!"

  docker-validation:
    name: Docker Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Backend Production Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.backend.prod
          load: true
          tags: insight-rag-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build Frontend Production Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.frontend.prod
          load: true
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
          tags: insight-rag-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Validate Images (OCI Labels & HEALTHCHECK)
        run: |
          for service in backend frontend; do
            image="insight-rag-${service}:latest"
            echo "Inspecting $image..."
            
            # Verify image exists
            docker inspect "$image" > /dev/null || exit 1
            
            # Verify OCI labels
            for label in title description version source; do
              val=$(docker inspect --format "{{index .Config.Labels \"org.opencontainers.image.${label}\"}}" "$image")
              if [ -z "$val" ] || [ "$val" = "<no value>" ]; then
                echo "Error: Missing OCI label org.opencontainers.image.${label} in $image"
                exit 1
              fi
              echo "  - org.opencontainers.image.${label}: $val"
            done
            
            # Verify HEALTHCHECK configuration exists
            health=$(docker inspect --format "{{json .Config.Healthcheck}}" "$image")
            if [ -z "$health" ] || [ "$health" = "null" ] || [ "$health" = "<no value>" ]; then
              echo "Error: Missing HEALTHCHECK instruction in $image"
              exit 1
            fi
            echo "  - HEALTHCHECK config: $health"
          done
          echo "All images validated successfully!"
